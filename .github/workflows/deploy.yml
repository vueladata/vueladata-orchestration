name: Deploy VuelaData Orchestration (Airflow & Spark) to AWS ECS

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: vueladata-cluster
  ECR_AIRFLOW_REPO: vueladata/airflow
  ECR_SPARK_REPO: vueladata/spark-etl

jobs:
  validate:
    name: Validate DAGs and Python Syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pinned Airflow test image
        run: docker build -t vueladata-airflow-test -f infrastructure/docker/airflow/Dockerfile .
      - name: Load DAGs and validate deployment contracts
        run: |
          mkdir -p reports
          chmod 777 reports
          docker run --rm --entrypoint bash -v "$PWD:/workspace" -w /workspace vueladata-airflow-test -c 'pip install pytest==8.4.2 && python -m pytest tests/test_dags.py tests/test_deployment.py -v --junitxml=reports/pytest-dags.xml'
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airflow-audit-tests
          path: reports/pytest-dags.xml

  validate-spark:
    name: Spark rules and immutable Gold contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Spark 3.5.1 image
        run: docker build -t vueladata-spark-test -f infrastructure/docker/spark/Dockerfile .
      - name: Run Spark acceptance tests
        run: |
          mkdir -p reports
          chmod 777 reports
          docker run --rm --user 0 --entrypoint bash -v "$PWD:/workspace" -w /workspace vueladata-spark-test -c 'python3 -m pip install pytest==8.3.5 && python3 -m pytest tests/spark -v --junitxml=reports/pytest-spark.xml'
      - name: Upload Spark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spark-acceptance-tests
          path: reports/pytest-spark.xml

  build-and-deploy:
    name: Build, Push to ECR & Update ECS
    needs: [validate, validate-spark]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Airflow Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo ">>> [1/2] Compilando imagen de Airflow 3.1.5 (linux/amd64)..."
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_AIRFLOW_REPO:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_AIRFLOW_REPO:latest \
            -t $ECR_REGISTRY/$ECR_AIRFLOW_REPO:3.1.5 \
            -f infrastructure/docker/airflow/Dockerfile .

          echo "Subiendo imagen de Airflow a ECR..."
          docker push $ECR_REGISTRY/$ECR_AIRFLOW_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_AIRFLOW_REPO:latest
          docker push $ECR_REGISTRY/$ECR_AIRFLOW_REPO:3.1.5

      - name: Build, Tag & Push Spark ETL Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo ">>> [2/2] Compilando imagen de Apache Spark ETL (linux/amd64)..."
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_SPARK_REPO:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_SPARK_REPO:latest \
            -f infrastructure/docker/spark/Dockerfile .

          echo "Subiendo imagen de Spark ETL a ECR..."
          docker push $ECR_REGISTRY/$ECR_SPARK_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_SPARK_REPO:latest

      - name: Deploy to Amazon ECS (Rolling Update Airflow Services)
        run: |
          echo "Actualizando servicios de Airflow en el clúster $ECS_CLUSTER..."
          AIRFLOW_SERVICES=("vueladata-airflow-scheduler" "vueladata-airflow-webserver" "vueladata-airflow-worker")
          
          for SERVICE in "${AIRFLOW_SERVICES[@]}"; do
            STATUS=$(aws ecs describe-services --cluster $ECS_CLUSTER --services $SERVICE --query 'services[0].status' --output text 2>/dev/null || echo "MISSING")
            if [ "$STATUS" == "ACTIVE" ]; then
              echo ">>> Actualizando servicio en caliente: $SERVICE"
              aws ecs update-service --cluster $ECS_CLUSTER --service $SERVICE --force-new-deployment
            else
              echo ">>> Aviso: Servicio $SERVICE no está activo en ECS (estado: $STATUS), omitiendo."
            fi
          done
          echo "Despliegue de orquestación completado con éxito."

