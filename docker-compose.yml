x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: infrastructure/docker/airflow/Dockerfile
  image: ${AIRFLOW_IMAGE_NAME:-vueladata/airflow:3.1.5}
  env_file:
    - .env
  environment: &airflow-environment
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN:-postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db}
    AIRFLOW__CELERY__RESULT_BACKEND: ${AIRFLOW__CELERY__RESULT_BACKEND:-db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_db}
    AIRFLOW__CELERY__BROKER_URL: ${AIRFLOW__CELERY__BROKER_URL:-amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//}

    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?Set AIRFLOW_API_SECRET_KEY}

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    S3_DATA_LAKE_BUCKET: ${S3_DATA_LAKE_BUCKET:-}
    ECS_CLUSTER_NAME: ${ECS_CLUSTER_NAME:-vueladata-cluster}
    ECS_SUBNET_IDS: ${ECS_SUBNET_IDS:-[]}
    ECS_SECURITY_GROUP_IDS: ${ECS_SECURITY_GROUP_IDS:-[]}
    ECS_SPARK_TASK_DEFINITION: ${ECS_SPARK_TASK_DEFINITION:-vueladata-spark-etl}
    ECS_SPARK_CONTAINER_NAME: ${ECS_SPARK_CONTAINER_NAME:-spark-etl}
    LAMBDA_OPENSKY_NAME: ${LAMBDA_OPENSKY_NAME:-opensky-ingestor}
    LAMBDA_OPENMETEO_NAME: ${LAMBDA_OPENMETEO_NAME:-openmeteo-ingestor}

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  # ============================================================================
  # 1. INFRAESTRUCTURA BASE: PostgreSQL & RabbitMQ
  # ============================================================================
  postgres:
    image: postgres:16
    container_name: vueladata-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vueladata}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
      - ../vueladata-database/schema_postgresql.sql:/docker-entrypoint-initdb.d/02-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: vueladata-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-rabbit_admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ============================================================================
  # 2. STACK AIRFLOW 3.1.5 (Orquestación & Celery Executor)
  # ============================================================================
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        (airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Airflow \
          --lastname Admin \
          --role Admin \
          --email admin@example.com ||
          airflow users list | grep -q "$${AIRFLOW_ADMIN_USERNAME}")
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type DagProcessorJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    environment:
      <<: *airflow-environment
      DUMB_INIT_SETSID: "0"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d \"celery@$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ============================================================================
  # 3. BACKEND API & WORKERS (F7: vueladata-api)
  # ============================================================================
  vueladata-api:
    build:
      context: ../vueladata-api
      dockerfile: Dockerfile
    container_name: vueladata-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vueladata}
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/db', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker-rds:
    build:
      context: ../vueladata-api
      dockerfile: Dockerfile
    container_name: vueladata-worker-rds
    command: ["python", "-m", "worker_rds.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vueladata}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit_admin}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      QUEUE_RDS: ${QUEUE_RDS:-q.rds_writer}
    volumes:
      - ./infrastructure/docker/health/worker_health.py:/opt/health/worker_health.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/opt/health/worker_health.py", "worker_rds.main"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker-lake:
    build:
      context: ../vueladata-api
      dockerfile: Dockerfile
    container_name: vueladata-worker-lake
    command: ["python", "-m", "worker_lake.main"]
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit_admin}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      QUEUE_LAKE: ${QUEUE_LAKE:-q.lake_writer}
      AWS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_BUCKET_BRONZE: ${S3_DATA_LAKE_BUCKET:-vueladata-datalake-bronze}
      LOCAL_LAKE_FALLBACK: "true"
      LAKE_FLUSH_EVERY_N: 50
      LAKE_FLUSH_EVERY_SECONDS: 60
    volumes:
      - ./infrastructure/docker/health/worker_health.py:/opt/health/worker_health.py:ro
      - datalake-bronze:/app/data/lake_bronze
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/opt/health/worker_health.py", "worker_lake.main"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  worker-notificaciones:
    build:
      context: ../vueladata-api
      dockerfile: Dockerfile
    container_name: vueladata-worker-notificaciones
    command: ["python", "-m", "worker_notificaciones.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vueladata}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit_admin}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_CLAVE: ${SMTP_CLAVE:-}
      SMTP_REMITENTE: ${SMTP_REMITENTE:-}
      EMAIL_DESTINO_PRUEBAS: ${EMAIL_DESTINO_PRUEBAS:-}
    volumes:
      - ./infrastructure/docker/health/worker_health.py:/opt/health/worker_health.py:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/opt/health/worker_health.py", "worker_notificaciones.main"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ============================================================================
  # 4. STREAM PRODUCER (F4: Simulador Eventos OOOI)
  # ============================================================================
  stream-producer:
    build:
      context: ../vueladata-stream
      dockerfile: Dockerfile
    container_name: vueladata-stream-f4
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-rabbit_admin}
      RABBITMQ_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      QUEUE_NAME: ${QUEUE_NAME:-eventos_oooi_queue}
      STREAM_DELAY_SECONDS: 1
      TOTAL_VUELOS: 100
    volumes:
      - ./infrastructure/docker/health/worker_health.py:/opt/health/worker_health.py:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/opt/health/worker_health.py", "src/producer.py"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: on-failure

volumes:
  postgres-data:
  datalake-bronze:
